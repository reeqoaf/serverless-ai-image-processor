name: 'Azure Login'
description: 'Login to Azure using Service Principal credentials'
inputs:
  credentials:
    description: 'Azure Service Principal credentials (JSON)'
    required: true
  subscription-id:
    description: 'Azure subscription ID'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ inputs.credentials }}
        
    - name: Set subscription context
      if: ${{ inputs.subscription-id != '' }}
      shell: bash
      run: |
        az account set --subscription "${{ inputs.subscription-id }}"
        echo "SUCCESS: Set Azure subscription context to: ${{ inputs.subscription-id }}"
        
    - name: Verify login
      shell: bash
      run: |
        ACCOUNT_INFO=$(az account show --query "{subscriptionId:id, tenantId:tenantId, name:name}" -o json)
        echo "SUCCESS: Azure login successful"
        echo "Account info: $ACCOUNT_INFO"
