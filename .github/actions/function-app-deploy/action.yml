name: 'Function App Deploy'
description: 'Deploy Azure Function App with verification'
inputs:
  app-name:
    description: 'Function App name'
    required: true
  package-path:
    description: 'Path to the deployment package'
    required: true
  publish-profile:
    description: 'Function App publish profile'
    required: true
  resource-group:
    description: 'Resource group name'
    required: true
  verify-deployment:
    description: 'Whether to verify deployment'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Deploy Function App
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ inputs.app-name }}
        package: ${{ inputs.package-path }}
        publish-profile: ${{ inputs.publish-profile }}
        
    - name: Verify deployment
      if: ${{ inputs.verify-deployment == 'true' }}
      shell: bash
      run: |
        echo "Verifying deployment for: ${{ inputs.app-name }}"
        
        # Check if function app is running
        STATUS=$(az functionapp show --name ${{ inputs.app-name }} --resource-group ${{ inputs.resource-group }} --query "state" -o tsv)
        echo "Function App Status: $STATUS"
        
        if [ "$STATUS" != "Running" ]; then
          echo "ERROR: Function App is not running. Current status: $STATUS"
          exit 1
        fi
        
        # Get function app URL
        FUNCTION_URL=$(az functionapp show --name ${{ inputs.app-name }} --resource-group ${{ inputs.resource-group }} --query "hostNames[0]" -o tsv)
        echo "SUCCESS: Function App deployed successfully!"
        echo "URL: https://$FUNCTION_URL"
        
        # Output the URL for other steps
        echo "function-url=https://$FUNCTION_URL" >> $GITHUB_OUTPUT
