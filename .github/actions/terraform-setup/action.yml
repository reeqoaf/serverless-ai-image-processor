name: 'Terraform Setup'
description: 'Setup Terraform with specified version and validate environment configuration'
inputs:
  version:
    description: 'Terraform version to install'
    required: false
    default: '1.10.0'
  working-directory:
    description: 'Terraform working directory'
    required: false
    default: 'terraform'
  environment:
    description: 'Environment name for validation'
    required: true
  validate-config:
    description: 'Whether to validate the environment configuration'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.version }}
        
    - name: Set environment variables
      shell: bash
      run: |
        echo "TF_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
        echo "TF_WORKING_DIR=${{ inputs.working-directory }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        
    - name: Validate environment configuration
      if: ${{ inputs.validate-config == 'true' }}
      shell: bash
      run: |
        TFVARS_FILE="${{ inputs.working-directory }}/envs/${{ inputs.environment }}/terraform.tfvars"
        if [ ! -f "$TFVARS_FILE" ]; then
          echo "ERROR: Environment configuration file not found: $TFVARS_FILE"
          echo "Please create the environment configuration file first."
          exit 1
        fi
        echo "SUCCESS: Found environment configuration: $TFVARS_FILE"
        
    - name: Terraform Init
      if: ${{ inputs.validate-config == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Parse the TF_BACKEND_CONFIG JSON secret
        RESOURCE_GROUP=$(echo '${{ secrets.TF_BACKEND_CONFIG }}' | jq -r '.resource_group_name')
        STORAGE_ACCOUNT=$(echo '${{ secrets.TF_BACKEND_CONFIG }}' | jq -r '.storage_account_name')
        CONTAINER=$(echo '${{ secrets.TF_BACKEND_CONFIG }}' | jq -r '.container_name')
        
        terraform init -backend-config="resource_group_name=$RESOURCE_GROUP" \
                      -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
                      -backend-config="container_name=$CONTAINER" \
                      -backend-config="key=terraform-${{ inputs.environment }}.tfstate"
        echo "SUCCESS: Terraform initialized successfully"
        
    - name: Terraform Validate
      if: ${{ inputs.validate-config == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform validate
        echo "SUCCESS: Terraform configuration is valid"
