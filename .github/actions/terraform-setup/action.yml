name: 'Terraform Setup'
description: 'Setup Terraform with specified version and initialize with backend configuration'
inputs:
  terraform-version:
    description: 'Terraform version to install'
    required: true
    default: '1.10.0'
  backend-config:
    description: 'Terraform backend configuration'
    required: true
  working-directory:
    description: 'Working directory for Terraform commands'
    required: false
    default: './terraform'
  environment:
    description: 'Environment name for state file key'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        BACKEND_ARGS=()
        BACKEND_ARGS+=("-backend-config=resource_group_name=$(echo '${{ inputs.backend-config }}' | jq -r '.resource_group_name')")
        BACKEND_ARGS+=("-backend-config=storage_account_name=$(echo '${{ inputs.backend-config }}' | jq -r '.storage_account_name')")
        BACKEND_ARGS+=("-backend-config=container_name=$(echo '${{ inputs.backend-config }}' | jq -r '.container_name')")
        BACKEND_ARGS+=("-backend-config=key=terraform-${{ inputs.environment }}.tfstate")
        
        terraform init -input=false "${BACKEND_ARGS[@]}"

    - name: Terraform Format Check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform validate
