name: 'Terraform Variables'
description: 'Set and validate Terraform environment variables for specified environment'
inputs:
  environment:
    description: 'Environment name (dev, staging, prod)'
    required: true
  spn-client-id:
    description: 'Service Principal Client ID'
    required: true
  spn-client-secret:
    description: 'Service Principal Client Secret'
    required: true
  spn-tenant-id:
    description: 'Service Principal Tenant ID'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set Terraform variables
      shell: bash
      run: |
        echo "Setting Terraform variables for ${{ inputs.environment }} environment..."
        
        # Set environment-specific variables
        case "${{ inputs.environment }}" in
          dev)
            echo "TF_VAR_subscription_id=${{ vars.DEV_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
            echo "TF_VAR_project_name=${{ vars.DEV_PROJECT_NAME }}" >> $GITHUB_ENV
            echo "TF_VAR_environment=${{ vars.DEV_ENVIRONMENT }}" >> $GITHUB_ENV
            echo "TF_VAR_location=${{ vars.DEV_LOCATION }}" >> $GITHUB_ENV
            echo "TF_VAR_storage_config_tier=${{ vars.DEV_STORAGE_TIER }}" >> $GITHUB_ENV
            echo "TF_VAR_storage_config_replication_type=${{ vars.DEV_STORAGE_REPLICATION_TYPE }}" >> $GITHUB_ENV
            echo "TF_VAR_storage_config_enable_versioning=${{ vars.DEV_STORAGE_ENABLE_VERSIONING }}" >> $GITHUB_ENV
            echo "TF_VAR_cognitive_services_config_sku_name=${{ vars.DEV_COGNITIVE_SERVICES_SKU }}" >> $GITHUB_ENV
            echo "TF_VAR_function_app_config_sku_tier=${{ vars.DEV_FUNCTION_APP_SKU_TIER }}" >> $GITHUB_ENV
            echo "TF_VAR_function_app_config_sku_size=${{ vars.DEV_FUNCTION_APP_SKU_SIZE }}" >> $GITHUB_ENV
            echo "TF_VAR_max_retries=${{ vars.DEV_MAX_RETRIES }}" >> $GITHUB_ENV
            echo "TF_VAR_tags_Project=${{ vars.DEV_TAGS_PROJECT }}" >> $GITHUB_ENV
            echo "TF_VAR_tags_Environment=${{ vars.DEV_TAGS_ENVIRONMENT }}" >> $GITHUB_ENV
            echo "TF_VAR_tags_ManagedBy=${{ vars.DEV_TAGS_MANAGED_BY }}" >> $GITHUB_ENV
            echo "TF_VAR_tags_Owner=${{ vars.DEV_TAGS_OWNER }}" >> $GITHUB_ENV
            echo "TF_VAR_tags_CostCenter=${{ vars.DEV_TAGS_COST_CENTER }}" >> $GITHUB_ENV
            ;;
          *)
            echo "ERROR: Unsupported environment: ${{ inputs.environment }}"
            echo "Supported environments: dev"
            exit 1
            ;;
        esac
        
        # Set SPN credentials for Terraform provider authentication
        echo "TF_VAR_spn_client_id=${{ inputs.spn-client-id }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_client_secret=${{ inputs.spn-client-secret }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_tenant_id=${{ inputs.spn-tenant-id }}" >> $GITHUB_ENV
        echo "SUCCESS: Environment variables set for ${{ inputs.environment }}"

    - name: Validate Terraform variables
      shell: bash
      run: |
        echo "Validating ALL required Terraform variables..."
        
        # All variables are required
        REQUIRED_VARS=(
          "TF_VAR_subscription_id"
          "TF_VAR_project_name"
          "TF_VAR_environment"
          "TF_VAR_location"
          "TF_VAR_storage_config_tier"
          "TF_VAR_storage_config_replication_type"
          "TF_VAR_storage_config_enable_versioning"
          "TF_VAR_cognitive_services_config_sku_name"
          "TF_VAR_function_app_config_sku_tier"
          "TF_VAR_function_app_config_sku_size"
          "TF_VAR_max_retries"
          "TF_VAR_tags_Project"
          "TF_VAR_tags_Environment"
          "TF_VAR_tags_ManagedBy"
          "TF_VAR_tags_Owner"
          "TF_VAR_tags_CostCenter"
          "TF_VAR_spn_client_id"
          "TF_VAR_spn_client_secret"
          "TF_VAR_spn_tenant_id"
        )
        
        MISSING_VARS=()
        
        for var in "${REQUIRED_VARS[@]}"; do
          if [ -z "${!var}" ]; then
            echo "ERROR: Required variable $var is not set"
            MISSING_VARS+=("$var")
          else
            echo "SUCCESS: $var is set"
          fi
        done
        
        if [ ${#MISSING_VARS[@]} -gt 0 ]; then
          echo ""
          echo "ERROR: Missing required variables:"
          printf '  - %s\n' "${MISSING_VARS[@]}"
          echo ""
          echo "Please ensure all environment variables are configured in GitHub:"
          echo "Settings > Secrets and variables > Actions > Environment variables > ${{ inputs.environment }}"
          exit 1
        fi
        
        echo ""
        echo "SUCCESS: All required variables are present and configured"
