name: 'Terraform Variables'
description: 'Set and validate Terraform environment variables for specified environment'
inputs:
  environment:
    description: 'Environment name (dev, staging, prod)'
    required: true
  spn-client-id:
    description: 'Service Principal Client ID'
    required: true
  spn-client-secret:
    description: 'Service Principal Client Secret'
    required: true
  spn-tenant-id:
    description: 'Service Principal Tenant ID'
    required: true
  # Environment-specific variables
  subscription-id:
    description: 'Azure Subscription ID'
    required: true
  project-name:
    description: 'Project name'
    required: true
  location:
    description: 'Azure location'
    required: true
  storage-tier:
    description: 'Storage account tier'
    required: true
  storage-replication-type:
    description: 'Storage replication type'
    required: true
  storage-enable-versioning:
    description: 'Enable storage versioning'
    required: true
  cognitive-services-sku:
    description: 'Cognitive Services SKU'
    required: true
  function-app-sku-tier:
    description: 'Function App SKU tier'
    required: true
  function-app-sku-size:
    description: 'Function App SKU size'
    required: true
  max-retries:
    description: 'Maximum retries'
    required: true
  tags-project:
    description: 'Project tag value'
    required: true
  tags-managed-by:
    description: 'ManagedBy tag value'
    required: true
  tags-owner:
    description: 'Owner tag value'
    required: true
  tags-cost-center:
    description: 'CostCenter tag value'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set Terraform variables
      shell: bash
      run: |
        echo "Setting Terraform variables for ${{ inputs.environment }} environment..."
        
        # Set environment-specific variables
        echo "TF_VAR_subscription_id=${{ inputs.subscription-id }}" >> $GITHUB_ENV
        echo "TF_VAR_project_name=${{ inputs.project-name }}" >> $GITHUB_ENV
        echo "TF_VAR_environment=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_location=${{ inputs.location }}" >> $GITHUB_ENV
        echo "TF_VAR_max_retries=${{ inputs.max-retries }}" >> $GITHUB_ENV
        
        # Create environment-specific tfvars file for complex objects
        cat > ./terraform-${{ inputs.environment }}.tfvars << EOF
# Storage configuration
storage_config = {
  tier              = "${{ inputs.storage-tier }}"
  replication_type  = "${{ inputs.storage-replication-type }}"
  enable_versioning = ${{ inputs.storage-enable-versioning }}
}

# Cognitive Services configuration
cognitive_services_config = {
  sku_name = "${{ inputs.cognitive-services-sku }}"
}

# Function App configuration
function_app_config = {
  sku_tier = "${{ inputs.function-app-sku-tier }}"
  sku_size = "${{ inputs.function-app-sku-size }}"
}

# Resource tags
tags = {
  Project     = "${{ inputs.tags-project }}"
  Environment = "${{ inputs.environment }}"
  ManagedBy   = "${{ inputs.tags-managed-by }}"
  Owner       = "${{ inputs.tags-owner }}"
  CostCenter  = "${{ inputs.tags-cost-center }}"
}
EOF
        
        # Set the environment-specific tfvars file path as an environment variable
        echo "TFVARS_FILE=./terraform-${{ inputs.environment }}.tfvars" >> $GITHUB_ENV
        
        # Set SPN credentials for Terraform provider authentication
        echo "TF_VAR_spn_client_id=${{ inputs.spn-client-id }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_client_secret=${{ inputs.spn-client-secret }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_tenant_id=${{ inputs.spn-tenant-id }}" >> $GITHUB_ENV
        
        # Also set ARM_* environment variables for Azure provider
        echo "ARM_CLIENT_ID=${{ inputs.spn-client-id }}" >> $GITHUB_ENV
        echo "ARM_CLIENT_SECRET=${{ inputs.spn-client-secret }}" >> $GITHUB_ENV
        echo "ARM_TENANT_ID=${{ inputs.spn-tenant-id }}" >> $GITHUB_ENV
        echo "ARM_SUBSCRIPTION_ID=${{ inputs.subscription-id }}" >> $GITHUB_ENV
        
        echo "SUCCESS: Environment variables set for ${{ inputs.environment }}"

    - name: Validate Terraform variables
      shell: bash
      run: |
        echo "Validating ALL required Terraform variables..."
        
        # All variables are required (excluding complex objects which are in tfvars file)
        REQUIRED_VARS=(
          "TF_VAR_subscription_id"
          "TF_VAR_project_name"
          "TF_VAR_environment"
          "TF_VAR_location"
          "TF_VAR_max_retries"
          "TF_VAR_spn_client_id"
          "TF_VAR_spn_client_secret"
          "TF_VAR_spn_tenant_id"
        )
        
        MISSING_VARS=()
        
        for var in "${REQUIRED_VARS[@]}"; do
          if [ -z "${!var}" ]; then
            echo "ERROR: Required variable $var is not set"
            MISSING_VARS+=("$var")
          else
            echo "SUCCESS: $var is set"
          fi
        done
        
        if [ ${#MISSING_VARS[@]} -gt 0 ]; then
          echo ""
          echo "ERROR: Missing required variables:"
          printf '  - %s\n' "${MISSING_VARS[@]}"
          echo ""
          echo "Please ensure all environment variables are configured in GitHub:"
          echo "Settings > Secrets and variables > Actions > Environment variables > ${{ inputs.environment }}"
          exit 1
        fi
        
        echo ""
        echo "SUCCESS: All required variables are present and configured"
