name: Destroy All (Function + Infrastructure)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      confirm_destroy:
        description: 'Type "DESTROY_ALL" to confirm (case sensitive)'
        required: true
        type: string
      destroy_function:
        description: 'Destroy function app'
        required: false
        default: true
        type: boolean
      destroy_infrastructure:
        description: 'Destroy infrastructure (Terraform)'
        required: false
        default: true
        type: boolean
      auto_approve:
        description: 'Auto-approve all destroy operations'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: '1.10.0'
  TF_WORKING_DIR: 'terraform'

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      resource-group: ${{ steps.set-env.outputs.resource-group }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }
        
    - name: Validate destroy confirmation
      run: |
        if [ "${{ inputs.confirm_destroy }}" != "DESTROY_ALL" ] && [ "${{ inputs.auto_approve }}" != "true" ]; then
          echo "ERROR: Destroy confirmation failed. You must type 'DESTROY_ALL' to confirm."
          echo "Received: '${{ inputs.confirm_destroy }}'"
          exit 1
        fi
        echo "SUCCESS: Destroy confirmation validated"
        
    - name: Set environment variables
      id: set-env
      run: |
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "PROJECT_NAME=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "resource-group=${{ vars.PROJECT_NAME || 'ai-image-processor' }}-${{ inputs.environment }}-rg" >> $GITHUB_OUTPUT
        
    - name: Pre-destroy verification
      run: |
        echo "## Pre-Destroy Verification" >> $GITHUB_STEP_SUMMARY
        echo "Checking resources in environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        
        # Check if resource group exists
        if az group show --name ${{ steps.set-env.outputs.resource-group }} > /dev/null 2>&1; then
          echo "SUCCESS: Resource group found: ${{ steps.set-env.outputs.resource-group }}" >> $GITHUB_STEP_SUMMARY
          
          # List all resources
          echo "### Current Resources" >> $GITHUB_STEP_SUMMARY
          az resource list --resource-group ${{ steps.set-env.outputs.resource-group }} --query "[].{Name:name, Type:type, Location:location}" --output table >> $GITHUB_STEP_SUMMARY
        else
          echo "WARNING: Resource group not found: ${{ steps.set-env.outputs.resource-group }}" >> $GITHUB_STEP_SUMMARY
          echo "No resources to destroy." >> $GITHUB_STEP_SUMMARY
        fi

  destroy-function:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.destroy_function }}
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }
        
    - name: Destroy Function App
      run: |
        echo "## Function App Destruction" >> $GITHUB_STEP_SUMMARY
        echo "Destroying function app in environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        
        # Get function app name
        FUNCTION_APP_NAME=$(az functionapp list --resource-group ${{ needs.validate.outputs.resource-group }} --query "[0].name" -o tsv)
        
        if [ -n "$FUNCTION_APP_NAME" ] && [ "$FUNCTION_APP_NAME" != "null" ]; then
          echo "Found function app: $FUNCTION_APP_NAME"
          
          # Delete the function app
          echo "Deleting function app..."
          az functionapp delete --name $FUNCTION_APP_NAME --resource-group ${{ needs.validate.outputs.resource-group }} --yes || true
          
          echo "SUCCESS: Function app destroyed: $FUNCTION_APP_NAME" >> $GITHUB_STEP_SUMMARY
        else
          echo "WARNING: No function app found in resource group" >> $GITHUB_STEP_SUMMARY
        fi

  destroy-infrastructure:
    runs-on: ubuntu-latest
    needs: [validate, destroy-function]
    if: always() && (needs.destroy-function.result == 'success' || needs.destroy-function.result == 'skipped') && ${{ inputs.destroy_infrastructure }}
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }
        
    - name: Destroy Infrastructure
      run: |
        echo "## Infrastructure Destruction" >> $GITHUB_STEP_SUMMARY
        echo "Destroying infrastructure in environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        
    - name: Set Terraform environment variables
      run: |
        echo "Setting Terraform environment variables..."
        echo "TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "TF_VAR_environment=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        echo "SUCCESS: Terraform environment variables set"
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Set Terraform environment variables
      run: |
        echo "TF_VERSION=${{ env.TF_VERSION }}" >> $GITHUB_ENV
        echo "TF_WORKING_DIR=${{ env.TF_WORKING_DIR }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "TF_VAR_environment=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        
    - name: List resources to be destroyed
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "### Resources to be destroyed by Terraform:" >> $GITHUB_STEP_SUMMARY
        terraform init \
          -backend-config="key=terraform-${{ inputs.environment }}.tfstate"
        terraform plan -destroy -out=destroy-plan
        terraform show -no-color destroy-plan | grep -E "^-|^~" | head -20 >> $GITHUB_STEP_SUMMARY
        echo "..." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**WARNING**: This will destroy all infrastructure in the ${{ inputs.environment }} environment!" >> $GITHUB_STEP_SUMMARY
        
    - name: Terraform Destroy
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        if [ "${{ inputs.auto_approve }}" == "true" ]; then
          terraform destroy -auto-approve
        else
          terraform destroy
        fi
        echo "SUCCESS: Infrastructure destroyed successfully"
        
    - name: Clean up local state
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        # Remove local state files (optional)
        if [ -f "terraform.tfstate" ]; then
          echo "Cleaning up local state files..."
          rm -f terraform.tfstate*
        fi
        echo "SUCCESS: Local state cleanup completed"

  verify:
    runs-on: ubuntu-latest
    needs: [validate, destroy-function, destroy-infrastructure]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }
        
    - name: Post-destroy verification
      run: |
        echo "## Post-Destroy Verification" >> $GITHUB_STEP_SUMMARY
        echo "Verifying destruction of environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        
        # Check if resource group still exists
        if az group show --name ${{ needs.validate.outputs.resource-group }} > /dev/null 2>&1; then
          echo "WARNING: Resource group still exists: ${{ needs.validate.outputs.resource-group }}" >> $GITHUB_STEP_SUMMARY
          echo "This might be expected if the resource group is not managed by Terraform." >> $GITHUB_STEP_SUMMARY
          
          # List any remaining resources
          echo "### Remaining Resources" >> $GITHUB_STEP_SUMMARY
          az resource list --resource-group ${{ needs.validate.outputs.resource-group }} --query "[].{Name:name, Type:type}" --output table >> $GITHUB_STEP_SUMMARY || echo "No remaining resources found" >> $GITHUB_STEP_SUMMARY
        else
          echo "SUCCESS: Resource group successfully destroyed: ${{ needs.validate.outputs.resource-group }}" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Destroy All Summary
      run: |
        echo "## Destroy All Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Confirmation: ${{ inputs.confirm_destroy }}" >> $GITHUB_STEP_SUMMARY
        echo "- Function App: ${{ inputs.destroy_function && 'Destroyed' || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Infrastructure: ${{ inputs.destroy_infrastructure && 'Destroyed' || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Auto-approve: ${{ inputs.auto_approve }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Complete destruction finished" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Note**: All requested components in the ${{ inputs.environment }} environment have been destroyed." >> $GITHUB_STEP_SUMMARY