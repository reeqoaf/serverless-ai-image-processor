name: Deploy Azure Function

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  deploy-function:
    name: Deploy Azure Function
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Validate Required Secrets
        run: |
          # Validate required environment secrets
          if [ -z "${{ secrets.FUNCTION_PUBLISH_PROFILE }}" ]; then
            echo "ERROR: Missing required environment secret: FUNCTION_PUBLISH_PROFILE"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        shell: bash
        working-directory: './src/AiImageProcessor'
        run: dotnet restore

      - name: Build function app
        shell: bash
        working-directory: './src/AiImageProcessor'
        run: |
          dotnet build --configuration Release --no-restore

      - name: Publish function app
        shell: bash
        working-directory: './src/AiImageProcessor'
        run: |
          dotnet publish --configuration Release --no-build --output ./publish

      - name: Create deployment package
        shell: bash
        working-directory: './src/AiImageProcessor'
        run: |
          cd publish
          zip -r ../function-app.zip . -x "*.pdb"

      - name: Extract Function App Name from Publish Profile
        id: extract-app-name
        shell: bash
        run: |
          # Extract app name from publish profile XML
          app_name=$(echo '${{ secrets.FUNCTION_PUBLISH_PROFILE }}' | grep -oP '(?<=publishUrl=")[^"]*' | sed 's|https://||' | sed 's|\.scm\.azurewebsites\.net||')
          echo "app_name=$app_name" >> $GITHUB_OUTPUT
          echo "Function App Name: $app_name"

      - name: Deploy function app
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.extract-app-name.outputs.app_name }}
          package: './src/AiImageProcessor/function-app.zip'
          publish-profile: ${{ secrets.FUNCTION_PUBLISH_PROFILE }}

      - name: Verify deployment
        shell: bash
        run: |
          echo "Function app deployed successfully!"
