name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy infrastructure to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      auto_approve:
        description: 'Auto-approve apply operation'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: '1.10.0'
  TF_WORKING_DIR: 'terraform'

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      resource-group: ${{ steps.set-env.outputs.resource-group }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set environment variables
      id: set-env
      run: |
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "PROJECT_NAME=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "LOCATION=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        echo "resource-group=${{ vars.PROJECT_NAME || 'ai-image-processor' }}-${{ inputs.environment }}-rg" >> $GITHUB_OUTPUT

  plan:
    runs-on: ubuntu-latest
    needs: init
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Azure CLI with Service Principal
      uses: azure/CLI@v1
      with:
        inlineScript: |
          echo "Setting up Azure CLI with Service Principal..."
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          
          echo "Setting Azure environment variables for Terraform..."
          export ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
          export ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}
          export ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          export ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
          echo "Setting Terraform environment variables..."
          export TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}
          export TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}
          export TF_VAR_environment=${{ inputs.environment }}
          export TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}
          export TF_VAR_spn_client_id=${{ secrets.AZURE_CLIENT_ID }}
          export TF_VAR_spn_client_secret=${{ secrets.AZURE_CLIENT_SECRET }}
          export TF_VAR_spn_tenant_id=${{ secrets.AZURE_TENANT_ID }}
          
          echo "SUCCESS: All environment variables set"
          
          echo "Running Terraform Init..."
          cd ${{ env.TF_WORKING_DIR }}
          terraform init \
            -backend-config="key=terraform-${{ inputs.environment }}.tfstate"
          echo "SUCCESS: Terraform initialized successfully"
          
          echo "Running Terraform Plan..."
          terraform plan -out=tfplan
          echo "SUCCESS: Terraform plan completed successfully"

    - name: Plan summary
      run: |
        echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working Directory: ${{ env.TF_WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Plan completed successfully" >> $GITHUB_STEP_SUMMARY

  apply:
    runs-on: ubuntu-latest
    needs: [init, plan]
    environment: ${{ inputs.environment }}
    outputs:
      deployment_success: ${{ steps.set-outputs.outputs.deployment_success }}
      resource_group: ${{ needs.init.outputs.resource-group }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Azure CLI with Service Principal
      uses: azure/CLI@v1
      with:
        inlineScript: |
          echo "Setting up Azure CLI with Service Principal..."
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          
          echo "Setting Azure environment variables for Terraform..."
          export ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
          export ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}
          export ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          export ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
          echo "Setting Terraform environment variables..."
          export TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}
          export TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}
          export TF_VAR_environment=${{ inputs.environment }}
          export TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}
          export TF_VAR_spn_client_id=${{ secrets.AZURE_CLIENT_ID }}
          export TF_VAR_spn_client_secret=${{ secrets.AZURE_CLIENT_SECRET }}
          export TF_VAR_spn_tenant_id=${{ secrets.AZURE_TENANT_ID }}
          
          echo "SUCCESS: All environment variables set"
          
          echo "Running Terraform Init..."
          cd ${{ env.TF_WORKING_DIR }}
          terraform init \
            -backend-config="key=terraform-${{ inputs.environment }}.tfstate"
          echo "SUCCESS: Terraform initialized successfully"
          
          echo "Running Terraform Apply..."
          if [ "${{ inputs.auto_approve }}" == "true" ]; then
            terraform apply -auto-approve
          else
            terraform apply
          fi
          echo "SUCCESS: Terraform apply completed successfully"
          
          echo "Getting Terraform outputs..."
          terraform output -json | jq -r 'to_entries[] | "- **\(.key)**: \(.value.value)"' >> $GITHUB_STEP_SUMMARY

    - name: Set outputs
      id: set-outputs
      run: |
        echo "deployment_success=true" >> $GITHUB_OUTPUT
        echo "resource_group=${{ needs.init.outputs.resource-group }}" >> $GITHUB_OUTPUT

    - name: Apply summary
      run: |
        echo "## Terraform Apply Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working Directory: ${{ env.TF_WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- Auto-approve: ${{ inputs.auto_approve }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Infrastructure deployed successfully" >> $GITHUB_STEP_SUMMARY

  verify:
    runs-on: ubuntu-latest
    needs: apply
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure CLI with Service Principal
      uses: azure/CLI@v1
      with:
        inlineScript: |
          echo "Setting up Azure CLI with Service Principal..."
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          
          echo "Verifying infrastructure..."
          RESOURCE_GROUP="${{ needs.apply.outputs.resource_group }}"
          echo "Verifying infrastructure in resource group: $RESOURCE_GROUP"
          
          # Check if resource group exists
          if ! az group show --name $RESOURCE_GROUP > /dev/null 2>&1; then
            echo "ERROR: Resource group not found: $RESOURCE_GROUP"
            exit 1
          fi
          
          # List resources in the resource group
          echo "## Resources Created" >> $GITHUB_STEP_SUMMARY
          az resource list --resource-group $RESOURCE_GROUP --query "[].{Name:name, Type:type, Location:location}" --output table >> $GITHUB_STEP_SUMMARY
          
          echo "SUCCESS: Infrastructure verification completed"
        
    - name: Final summary
      run: |
        echo "## Terraform Infrastructure Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working Directory: ${{ env.TF_WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Infrastructure deployed and verified successfully" >> $GITHUB_STEP_SUMMARY