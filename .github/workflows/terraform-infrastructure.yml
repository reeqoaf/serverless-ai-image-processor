name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy infrastructure to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      auto_approve:
        description: 'Auto-approve apply operation'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: '1.10.0'
  TF_WORKING_DIR: 'terraform'

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      resource-group: ${{ steps.set-env.outputs.resource-group }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set environment variables
      id: set-env
      run: |
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "PROJECT_NAME=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "LOCATION=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        echo "resource-group=${{ vars.PROJECT_NAME || 'ai-image-processor' }}-${{ inputs.environment }}-rg" >> $GITHUB_OUTPUT
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Set Terraform environment variables
      run: |
        echo "Setting Terraform environment variables..."
        echo "TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "TF_VAR_environment=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        echo "SUCCESS: Terraform environment variables set"

  plan:
    runs-on: ubuntu-latest
    needs: init
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Set Terraform environment variables
      run: |
        echo "TF_VERSION=${{ env.TF_VERSION }}" >> $GITHUB_ENV
        echo "TF_WORKING_DIR=${{ env.TF_WORKING_DIR }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "TF_VAR_environment=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        
    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="key=terraform-${{ inputs.environment }}.tfstate"
        echo "SUCCESS: Terraform initialized successfully"
        
    - name: Terraform Plan
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform plan -out=tfplan
        echo "SUCCESS: Terraform plan completed successfully"

    - name: Plan summary
      run: |
        echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working Directory: ${{ env.TF_WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Plan completed successfully" >> $GITHUB_STEP_SUMMARY

  apply:
    runs-on: ubuntu-latest
    needs: [init, plan]
    environment: ${{ inputs.environment }}
    outputs:
      deployment_success: ${{ steps.set-outputs.outputs.deployment_success }}
      resource_group: ${{ needs.init.outputs.resource-group }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Set Terraform environment variables
      run: |
        echo "TF_VERSION=${{ env.TF_VERSION }}" >> $GITHUB_ENV
        echo "TF_WORKING_DIR=${{ env.TF_WORKING_DIR }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "TF_VAR_environment=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        
    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="key=terraform-${{ inputs.environment }}.tfstate"
        echo "SUCCESS: Terraform initialized successfully"
        
    - name: Terraform Apply
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        if [ "${{ inputs.auto_approve }}" == "true" ]; then
          terraform apply -auto-approve
        else
          terraform apply
        fi
        echo "SUCCESS: Terraform apply completed successfully"
        
    - name: Get Terraform outputs
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "## Infrastructure Outputs" >> $GITHUB_STEP_SUMMARY
        terraform output -json | jq -r 'to_entries[] | "- **\(.key)**: \(.value.value)"' >> $GITHUB_STEP_SUMMARY

    - name: Set outputs
      id: set-outputs
      run: |
        echo "deployment_success=true" >> $GITHUB_OUTPUT
        echo "resource_group=${{ needs.init.outputs.resource-group }}" >> $GITHUB_OUTPUT

    - name: Apply summary
      run: |
        echo "## Terraform Apply Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working Directory: ${{ env.TF_WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- Auto-approve: ${{ inputs.auto_approve }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Infrastructure deployed successfully" >> $GITHUB_STEP_SUMMARY

  verify:
    runs-on: ubuntu-latest
    needs: apply
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Verify infrastructure
      run: |
        echo "## Infrastructure Verification" >> $GITHUB_STEP_SUMMARY
        RESOURCE_GROUP="${{ needs.apply.outputs.resource_group }}"
        echo "Verifying infrastructure in resource group: $RESOURCE_GROUP"
        
        # Check if resource group exists
        if ! az group show --name $RESOURCE_GROUP > /dev/null 2>&1; then
          echo "ERROR: Resource group not found: $RESOURCE_GROUP"
          exit 1
        fi
        
        # List resources in the resource group
        echo "## Resources Created" >> $GITHUB_STEP_SUMMARY
        az resource list --resource-group $RESOURCE_GROUP --query "[].{Name:name, Type:type, Location:location}" --output table >> $GITHUB_STEP_SUMMARY
        
        echo "SUCCESS: Infrastructure verification completed"
        
    - name: Final summary
      run: |
        echo "## Terraform Infrastructure Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working Directory: ${{ env.TF_WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Infrastructure deployed and verified successfully" >> $GITHUB_STEP_SUMMARY