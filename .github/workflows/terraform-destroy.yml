name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      auto_approve:
        description: 'Auto-approve destroy operation'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: '1.10.0'
  TF_WORKING_DIR: 'terraform'

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      resource-group: ${{ steps.set-env.outputs.resource-group }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set environment variables
      id: set-env
      run: |
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "PROJECT_NAME=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "LOCATION=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        echo "resource-group=${{ vars.PROJECT_NAME || 'ai-image-processor' }}-${{ inputs.environment }}-rg" >> $GITHUB_OUTPUT
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Set Terraform environment variables
      run: |
        echo "Setting Terraform environment variables..."
        echo "TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "TF_VAR_environment=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_client_id=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_tenant_id=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
        
    - name: Set Azure environment variables for Terraform
      run: |
        echo "Setting Azure environment variables for Terraform..."
        echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
        echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
        echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "SUCCESS: Azure environment variables set"
        echo "SUCCESS: Terraform environment variables set"

  plan:
    runs-on: ubuntu-latest
    needs: init
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Set Terraform environment variables
      run: |
        echo "TF_VERSION=${{ env.TF_VERSION }}" >> $GITHUB_ENV
        echo "TF_WORKING_DIR=${{ env.TF_WORKING_DIR }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "TF_VAR_environment=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_client_id=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_tenant_id=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
        
    - name: Set Azure environment variables for Terraform
      run: |
        echo "Setting Azure environment variables for Terraform..."
        echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
        echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
        echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "SUCCESS: Azure environment variables set"
        
    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="key=terraform-${{ inputs.environment }}.tfstate"
        echo "SUCCESS: Terraform initialized successfully"

    - name: Init summary
      run: |
        echo "## Terraform Init Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working Directory: ${{ env.TF_WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Initialized successfully" >> $GITHUB_STEP_SUMMARY
        
    - name: List resources to be destroyed
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "## Resources to be Destroyed" >> $GITHUB_STEP_SUMMARY
        terraform plan -destroy -out=destroy-plan
        terraform show -no-color destroy-plan | grep -E "^-|^~" | head -20 >> $GITHUB_STEP_SUMMARY
        echo "..." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**WARNING**: This will destroy all infrastructure in the ${{ inputs.environment }} environment!" >> $GITHUB_STEP_SUMMARY

  destroy:
    runs-on: ubuntu-latest
    needs: [init, plan]
    environment: ${{ inputs.environment }}
    outputs:
      destruction_success: ${{ steps.set-outputs.outputs.destruction_success }}
      resource_group: ${{ needs.init.outputs.resource-group }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Set Terraform environment variables
      run: |
        echo "TF_VERSION=${{ env.TF_VERSION }}" >> $GITHUB_ENV
        echo "TF_WORKING_DIR=${{ env.TF_WORKING_DIR }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_project_name=${{ vars.PROJECT_NAME || 'ai-image-processor' }}" >> $GITHUB_ENV
        echo "TF_VAR_environment=${{ inputs.environment }}" >> $GITHUB_ENV
        echo "TF_VAR_location=${{ vars.LOCATION || 'West Europe' }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_client_id=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "TF_VAR_spn_tenant_id=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
        
    - name: Set Azure environment variables for Terraform
      run: |
        echo "Setting Azure environment variables for Terraform..."
        echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
        echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
        echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "SUCCESS: Azure environment variables set"
        
    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="key=terraform-${{ inputs.environment }}.tfstate"
        echo "SUCCESS: Terraform initialized successfully"
        
    - name: Terraform Destroy
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        if [ "${{ inputs.auto_approve }}" == "true" ]; then
          terraform destroy -auto-approve
        else
          terraform destroy
        fi
        echo "SUCCESS: Terraform destroy completed successfully"
        
    - name: Set outputs
      id: set-outputs
      run: |
        echo "destruction_success=true" >> $GITHUB_OUTPUT
        echo "resource_group=${{ needs.init.outputs.resource-group }}" >> $GITHUB_OUTPUT

    - name: Destroy summary
      run: |
        echo "## Terraform Destroy Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working Directory: ${{ env.TF_WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- Auto-approve: ${{ inputs.auto_approve }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Infrastructure destroyed successfully" >> $GITHUB_STEP_SUMMARY

  verify:
    runs-on: ubuntu-latest
    needs: destroy
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Verify destruction
      run: |
        echo "## Destruction Verification" >> $GITHUB_STEP_SUMMARY
        RESOURCE_GROUP="${{ needs.destroy.outputs.resource_group }}"
        echo "Verifying destruction of resource group: $RESOURCE_GROUP"
        
        # Check if resource group still exists
        if az group show --name $RESOURCE_GROUP > /dev/null 2>&1; then
          echo "WARNING: Resource group still exists: $RESOURCE_GROUP"
          echo "This may indicate that some resources were not destroyed."
          
          # List remaining resources
          echo "## Remaining Resources" >> $GITHUB_STEP_SUMMARY
          az resource list --resource-group $RESOURCE_GROUP --query "[].{Name:name, Type:type, Location:location}" --output table >> $GITHUB_STEP_SUMMARY
        else
          echo "SUCCESS: Resource group has been completely destroyed: $RESOURCE_GROUP"
        fi
        
        echo "SUCCESS: Destruction verification completed"
        
    - name: Final summary
      run: |
        echo "## Terraform Destroy Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working Directory: ${{ env.TF_WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Infrastructure destroyed and verified" >> $GITHUB_STEP_SUMMARY