name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

env:
  TF_VERSION: '1.10.0'
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Validate Required Repository Secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] || [ -z "${{ secrets.TF_BACKEND_CONFIG }}" ]; then
            echo "ERROR: Missing required repository secrets"
            exit 1
          fi

      - name: Validate Environment
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev) ;;
            *) echo "ERROR: Invalid environment: ${{ github.event.inputs.environment }}"; exit 1 ;;
          esac

      - name: Validate Environment Variables
        run: |
          # Validate required secrets
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] || [ -z "${{ secrets.TF_BACKEND_CONFIG }}" ]; then
            echo "ERROR: Missing required secrets: AZURE_CREDENTIALS, TF_BACKEND_CONFIG"
            exit 1
          fi
          
          # Validate required environment variables
          MISSING_VARS=()
          [ -z "${{ vars.SUBSCRIPTION_ID }}" ] && MISSING_VARS+=("SUBSCRIPTION_ID")
          [ -z "${{ vars.PROJECT_NAME }}" ] && MISSING_VARS+=("PROJECT_NAME")
          [ -z "${{ vars.LOCATION }}" ] && MISSING_VARS+=("LOCATION")
          [ -z "${{ vars.STORAGE_TIER }}" ] && MISSING_VARS+=("STORAGE_TIER")
          [ -z "${{ vars.STORAGE_REPLICATION_TYPE }}" ] && MISSING_VARS+=("STORAGE_REPLICATION_TYPE")
          [ -z "${{ vars.STORAGE_ENABLE_VERSIONING }}" ] && MISSING_VARS+=("STORAGE_ENABLE_VERSIONING")
          [ -z "${{ vars.COGNITIVE_SERVICES_SKU }}" ] && MISSING_VARS+=("COGNITIVE_SERVICES_SKU")
          [ -z "${{ vars.FUNCTION_APP_SKU_TIER }}" ] && MISSING_VARS+=("FUNCTION_APP_SKU_TIER")
          [ -z "${{ vars.FUNCTION_APP_SKU_SIZE }}" ] && MISSING_VARS+=("FUNCTION_APP_SKU_SIZE")
          [ -z "${{ vars.MAX_RETRIES }}" ] && MISSING_VARS+=("MAX_RETRIES")
          [ -z "${{ vars.TAGS_PROJECT }}" ] && MISSING_VARS+=("TAGS_PROJECT")
          [ -z "${{ vars.TAGS_MANAGED_BY }}" ] && MISSING_VARS+=("TAGS_MANAGED_BY")
          [ -z "${{ vars.TAGS_OWNER }}" ] && MISSING_VARS+=("TAGS_OWNER")
          [ -z "${{ vars.TAGS_COST_CENTER }}" ] && MISSING_VARS+=("TAGS_COST_CENTER")
          
          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo "ERROR: Missing environment variables: ${MISSING_VARS[*]}"
            exit 1
          fi


      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: ./.github/actions/azure-login
        with:
          azure-credentials: ${{ env.AZURE_CREDENTIALS }}

      - name: Parse Azure credentials for Terraform
        id: parse-azure-creds
        run: |
          echo "spn_client_id=$(echo '${{ env.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> $GITHUB_OUTPUT
          echo "spn_client_secret=$(echo '${{ env.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> $GITHUB_OUTPUT
          echo "spn_tenant_id=$(echo '${{ env.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> $GITHUB_OUTPUT

      - name: Set Terraform Variables
        uses: ./.github/actions/terraform-variables
        with:
          environment: ${{ github.event.inputs.environment }}
          spn-client-id: ${{ steps.parse-azure-creds.outputs.spn_client_id }}
          spn-client-secret: ${{ steps.parse-azure-creds.outputs.spn_client_secret }}
          spn-tenant-id: ${{ steps.parse-azure-creds.outputs.spn_tenant_id }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}
          project-name: ${{ vars.PROJECT_NAME }}
          location: ${{ vars.LOCATION }}
          storage-tier: ${{ vars.STORAGE_TIER }}
          storage-replication-type: ${{ vars.STORAGE_REPLICATION_TYPE }}
          storage-enable-versioning: ${{ vars.STORAGE_ENABLE_VERSIONING }}
          cognitive-services-sku: ${{ vars.COGNITIVE_SERVICES_SKU }}
          function-app-sku-tier: ${{ vars.FUNCTION_APP_SKU_TIER }}
          function-app-sku-size: ${{ vars.FUNCTION_APP_SKU_SIZE }}
          max-retries: ${{ vars.MAX_RETRIES }}
          tags-project: ${{ vars.TAGS_PROJECT }}
          tags-managed-by: ${{ vars.TAGS_MANAGED_BY }}
          tags-owner: ${{ vars.TAGS_OWNER }}
          tags-cost-center: ${{ vars.TAGS_COST_CENTER }}

      - name: Terraform Setup
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TF_VERSION }}
          backend-config: ${{ env.TF_BACKEND_CONFIG }}
          working-directory: './terraform'
          environment: ${{ github.event.inputs.environment }}

      - name: Terraform Destroy
        shell: bash
        working-directory: './terraform'
        run: |
          terraform destroy -input=false -var-file="terraform-${{ github.event.inputs.environment }}.tfvars" -auto-approve

      - name: Terraform Output
        if: always()
        shell: bash
        working-directory: './terraform'
        run: |
          terraform output -json | jq -r 'to_entries[] | "\(.key): \(.value.value)"'

      - name: Cleanup
        if: always()
        shell: bash
        working-directory: './terraform'
        run: |
          rm -f terraform-${{ github.event.inputs.environment }}.tfvars