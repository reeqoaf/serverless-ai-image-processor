name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      confirm_destroy:
        description: 'Type "DESTROY" to confirm destruction of all resources'
        required: true
        type: string

env:
  TF_VERSION: '1.10.0'
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}

jobs:
  validate-inputs:
    name: Validate Inputs
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.validate.outputs.environment }}
    steps:
      - name: Validate Required Secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "ERROR: AZURE_CREDENTIALS secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.TF_BACKEND_CONFIG }}" ]; then
            echo "ERROR: TF_BACKEND_CONFIG secret is not set"
            exit 1
          fi
          echo "SUCCESS: All required secrets are present"

      - name: Validate Environment Variables
        id: validate
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          CONFIRM="${{ github.event.inputs.confirm_destroy }}"
          
          # Validate environment
          case "$ENVIRONMENT" in
            dev)
              echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
              echo "SUCCESS: Environment '$ENVIRONMENT' is valid"
              ;;
            *)
              echo "ERROR: Invalid environment: $ENVIRONMENT"
              echo "Supported environments: dev"
              exit 1
              ;;
          esac
          
          # Validate all required environment variables are present
          echo "Validating environment variables for $ENVIRONMENT..."
          
          MISSING_VARS=()
          
          # Check each variable individually
          if [ -z "${{ vars.DEV_SUBSCRIPTION_ID }}" ]; then MISSING_VARS+=("DEV_SUBSCRIPTION_ID"); fi
          if [ -z "${{ vars.DEV_PROJECT_NAME }}" ]; then MISSING_VARS+=("DEV_PROJECT_NAME"); fi
          if [ -z "${{ vars.DEV_ENVIRONMENT }}" ]; then MISSING_VARS+=("DEV_ENVIRONMENT"); fi
          if [ -z "${{ vars.DEV_LOCATION }}" ]; then MISSING_VARS+=("DEV_LOCATION"); fi
          if [ -z "${{ vars.DEV_STORAGE_TIER }}" ]; then MISSING_VARS+=("DEV_STORAGE_TIER"); fi
          if [ -z "${{ vars.DEV_STORAGE_REPLICATION_TYPE }}" ]; then MISSING_VARS+=("DEV_STORAGE_REPLICATION_TYPE"); fi
          if [ -z "${{ vars.DEV_STORAGE_ENABLE_VERSIONING }}" ]; then MISSING_VARS+=("DEV_STORAGE_ENABLE_VERSIONING"); fi
          if [ -z "${{ vars.DEV_COGNITIVE_SERVICES_SKU }}" ]; then MISSING_VARS+=("DEV_COGNITIVE_SERVICES_SKU"); fi
          if [ -z "${{ vars.DEV_FUNCTION_APP_SKU_TIER }}" ]; then MISSING_VARS+=("DEV_FUNCTION_APP_SKU_TIER"); fi
          if [ -z "${{ vars.DEV_FUNCTION_APP_SKU_SIZE }}" ]; then MISSING_VARS+=("DEV_FUNCTION_APP_SKU_SIZE"); fi
          if [ -z "${{ vars.DEV_MAX_RETRIES }}" ]; then MISSING_VARS+=("DEV_MAX_RETRIES"); fi
          if [ -z "${{ vars.DEV_TAGS_PROJECT }}" ]; then MISSING_VARS+=("DEV_TAGS_PROJECT"); fi
          if [ -z "${{ vars.DEV_TAGS_ENVIRONMENT }}" ]; then MISSING_VARS+=("DEV_TAGS_ENVIRONMENT"); fi
          if [ -z "${{ vars.DEV_TAGS_MANAGED_BY }}" ]; then MISSING_VARS+=("DEV_TAGS_MANAGED_BY"); fi
          if [ -z "${{ vars.DEV_TAGS_OWNER }}" ]; then MISSING_VARS+=("DEV_TAGS_OWNER"); fi
          if [ -z "${{ vars.DEV_TAGS_COST_CENTER }}" ]; then MISSING_VARS+=("DEV_TAGS_COST_CENTER"); fi
          
          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo ""
            echo "ERROR: Missing required environment variables:"
            printf '  - %s\n' "${MISSING_VARS[@]}"
            echo ""
            echo "Please ensure all environment variables are configured in GitHub:"
            echo "Settings > Secrets and variables > Actions > Environment variables > $ENVIRONMENT"
            exit 1
          fi
          
          echo ""
          echo "SUCCESS: All required environment variables are present and configured"
          
          # Validate destroy confirmation
          if [ "$CONFIRM" != "DESTROY" ]; then
            echo "ERROR: Destroy confirmation failed"
            echo "You must type 'DESTROY' to confirm destruction of all resources"
            exit 1
          fi
          echo "SUCCESS: Destroy confirmation received"

  terraform-destroy:
    name: Terraform Destroy
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment: ${{ needs.validate-inputs.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: ./.github/actions/azure-login
        with:
          azure-credentials: ${{ env.AZURE_CREDENTIALS }}

      - name: Parse Azure credentials for Terraform
        id: parse-azure-creds
        run: |
          echo "Parsing Azure credentials for Terraform from repository secrets..."
          # Parse SPN credentials from AZURE_CREDENTIALS secret (JSON format)
          echo "spn_client_id=$(echo '${{ env.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> $GITHUB_OUTPUT
          echo "spn_client_secret=$(echo '${{ env.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> $GITHUB_OUTPUT
          echo "spn_tenant_id=$(echo '${{ env.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> $GITHUB_OUTPUT
          echo "SUCCESS: SPN credentials parsed from repository secrets"

      - name: Set Terraform Variables
        uses: ./.github/actions/terraform-variables
        with:
          environment: ${{ needs.validate-inputs.outputs.environment }}
          spn-client-id: ${{ steps.parse-azure-creds.outputs.spn_client_id }}
          spn-client-secret: ${{ steps.parse-azure-creds.outputs.spn_client_secret }}
          spn-tenant-id: ${{ steps.parse-azure-creds.outputs.spn_tenant_id }}
          subscription-id: ${{ vars.DEV_SUBSCRIPTION_ID }}
          project-name: ${{ vars.DEV_PROJECT_NAME }}
          location: ${{ vars.DEV_LOCATION }}
          storage-tier: ${{ vars.DEV_STORAGE_TIER }}
          storage-replication-type: ${{ vars.DEV_STORAGE_REPLICATION_TYPE }}
          storage-enable-versioning: ${{ vars.DEV_STORAGE_ENABLE_VERSIONING }}
          cognitive-services-sku: ${{ vars.DEV_COGNITIVE_SERVICES_SKU }}
          function-app-sku-tier: ${{ vars.DEV_FUNCTION_APP_SKU_TIER }}
          function-app-sku-size: ${{ vars.DEV_FUNCTION_APP_SKU_SIZE }}
          max-retries: ${{ vars.DEV_MAX_RETRIES }}
          tags-project: ${{ vars.DEV_TAGS_PROJECT }}
          tags-environment: ${{ vars.DEV_TAGS_ENVIRONMENT }}
          tags-managed-by: ${{ vars.DEV_TAGS_MANAGED_BY }}
          tags-owner: ${{ vars.DEV_TAGS_OWNER }}
          tags-cost-center: ${{ vars.DEV_TAGS_COST_CENTER }}

      - name: Terraform Setup
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TF_VERSION }}
          backend-config: ${{ env.TF_BACKEND_CONFIG }}
          working-directory: './terraform'

      - name: Terraform Destroy
        uses: ./.github/actions/terraform-destroy
        with:
          working-directory: './terraform'
          auto-approve: 'true'
