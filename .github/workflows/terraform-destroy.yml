name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      confirm_destroy:
        description: 'Type "DESTROY" to confirm destruction of all resources'
        required: true
        type: string

env:
  TF_VERSION: '1.10.0'
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Validate Required Repository Secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] || [ -z "${{ secrets.TF_BACKEND_CONFIG }}" ]; then
            echo "ERROR: Missing required repository secrets"
            exit 1
          fi

      - name: Validate Environment
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev) ;;
            *) echo "ERROR: Invalid environment: ${{ github.event.inputs.environment }}"; exit 1 ;;
          esac

      - name: Validate Environment Secrets
        run: |
          MISSING_VARS=()
          for var in SUBSCRIPTION_ID PROJECT_NAME LOCATION STORAGE_TIER STORAGE_REPLICATION_TYPE STORAGE_ENABLE_VERSIONING COGNITIVE_SERVICES_SKU FUNCTION_APP_SKU_TIER FUNCTION_APP_SKU_SIZE MAX_RETRIES TAGS_PROJECT TAGS_MANAGED_BY TAGS_OWNER TAGS_COST_CENTER; do
            if [ -z "${{ secrets[var] }}" ]; then
              MISSING_VARS+=("$var")
            fi
          done
          
          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo "ERROR: Missing environment secrets: ${MISSING_VARS[*]}"
            exit 1
          fi

      - name: Validate Destroy Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "ERROR: Destroy confirmation required"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: ./.github/actions/azure-login
        with:
          azure-credentials: ${{ env.AZURE_CREDENTIALS }}

      - name: Parse Azure credentials for Terraform
        id: parse-azure-creds
        run: |
          echo "spn_client_id=$(echo '${{ env.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> $GITHUB_OUTPUT
          echo "spn_client_secret=$(echo '${{ env.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> $GITHUB_OUTPUT
          echo "spn_tenant_id=$(echo '${{ env.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> $GITHUB_OUTPUT

      - name: Set Terraform Variables
        uses: ./.github/actions/terraform-variables
        with:
          environment: ${{ github.event.inputs.environment }}
          spn-client-id: ${{ steps.parse-azure-creds.outputs.spn_client_id }}
          spn-client-secret: ${{ steps.parse-azure-creds.outputs.spn_client_secret }}
          spn-tenant-id: ${{ steps.parse-azure-creds.outputs.spn_tenant_id }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
          project-name: ${{ secrets.PROJECT_NAME }}
          location: ${{ secrets.LOCATION }}
          storage-tier: ${{ secrets.STORAGE_TIER }}
          storage-replication-type: ${{ secrets.STORAGE_REPLICATION_TYPE }}
          storage-enable-versioning: ${{ secrets.STORAGE_ENABLE_VERSIONING }}
          cognitive-services-sku: ${{ secrets.COGNITIVE_SERVICES_SKU }}
          function-app-sku-tier: ${{ secrets.FUNCTION_APP_SKU_TIER }}
          function-app-sku-size: ${{ secrets.FUNCTION_APP_SKU_SIZE }}
          max-retries: ${{ secrets.MAX_RETRIES }}
          tags-project: ${{ secrets.TAGS_PROJECT }}
          tags-managed-by: ${{ secrets.TAGS_MANAGED_BY }}
          tags-owner: ${{ secrets.TAGS_OWNER }}
          tags-cost-center: ${{ secrets.TAGS_COST_CENTER }}

      - name: Terraform Setup
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TF_VERSION }}
          backend-config: ${{ env.TF_BACKEND_CONFIG }}
          working-directory: './terraform'
          environment: ${{ github.event.inputs.environment }}

      - name: Terraform Destroy
        shell: bash
        working-directory: './terraform'
        run: |
          terraform destroy -input=false -var-file="terraform-${{ github.event.inputs.environment }}.tfvars" -auto-approve

      - name: Terraform Output
        if: always()
        shell: bash
        working-directory: './terraform'
        run: |
          terraform output -json | jq -r 'to_entries[] | "\(.key): \(.value.value)"'

      - name: Cleanup
        if: always()
        shell: bash
        working-directory: './terraform'
        run: |
          rm -f terraform-${{ github.event.inputs.environment }}.tfvars