name: Deploy Azure Function

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      function_app_name:
        description: 'Function App Name (leave empty for auto-detection)'
        required: false
        type: string
      skip_build:
        description: 'Skip build step (use existing artifacts)'
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'src/AiImageProcessor'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Download build artifacts
      if: ${{ inputs.skip_build }}
      uses: actions/download-artifact@v4
      with:
        name: function-app-build
        path: ./publish
        
    - name: Build project
      if: ${{ !inputs.skip_build }}
      run: |
        dotnet restore ${{ env.PROJECT_PATH }}
        dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
        dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ./publish --no-build
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Get Function App Name
      id: get-function-app-name
      run: |
        if [ -n "${{ inputs.function_app_name }}" ]; then
          echo "name=${{ inputs.function_app_name }}" >> $GITHUB_OUTPUT
        else
          # Auto-detect function app name from Terraform state or resource group
          RESOURCE_GROUP="${{ vars.PROJECT_NAME || 'ai-image-processor' }}-${{ inputs.environment }}-rg"
          FUNCTION_APP_NAME=$(az functionapp list --resource-group $RESOURCE_GROUP --query "[0].name" -o tsv)
          if [ -z "$FUNCTION_APP_NAME" ]; then
            echo "ERROR: Function App not found in resource group: $RESOURCE_GROUP"
            echo "Please ensure the infrastructure is deployed first or provide the function app name manually."
            exit 1
          fi
          echo "name=$FUNCTION_APP_NAME" >> $GITHUB_OUTPUT
        fi
        echo "Function App Name: $FUNCTION_APP_NAME"
        
    - name: Deploy Function App
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ steps.get-function-app-name.outputs.name }}
        package: ./publish
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        
    - name: Verify deployment
      run: |
        FUNCTION_APP_NAME="${{ steps.get-function-app-name.outputs.name }}"
        echo "Verifying deployment for: $FUNCTION_APP_NAME"
        
        # Check if function app is running
        STATUS=$(az functionapp show --name $FUNCTION_APP_NAME --resource-group "${{ vars.PROJECT_NAME || 'ai-image-processor' }}-${{ inputs.environment }}-rg" --query "state" -o tsv)
        echo "Function App Status: $STATUS"
        
        if [ "$STATUS" != "Running" ]; then
          echo "ERROR: Function App is not running. Current status: $STATUS"
          exit 1
        fi
        
        # Get function app URL
        FUNCTION_URL=$(az functionapp show --name $FUNCTION_APP_NAME --resource-group "${{ vars.PROJECT_NAME || 'ai-image-processor' }}-${{ inputs.environment }}-rg" --query "hostNames[0]" -o tsv)
        echo "SUCCESS: Function App deployed successfully!"
        echo "URL: https://$FUNCTION_URL"
        
    - name: Deployment summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- Function App: ${{ steps.get-function-app-name.outputs.name }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build: ${{ inputs.skip_build && 'Skipped (used artifacts)' || 'Completed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Deployed successfully" >> $GITHUB_STEP_SUMMARY
