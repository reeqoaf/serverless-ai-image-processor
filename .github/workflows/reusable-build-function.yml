name: Reusable Build Function

on:
  workflow_call:
    inputs:
      project_path:
        description: 'Path to the .NET project'
        required: false
        default: 'src/AiImageProcessor'
        type: string
      dotnet_version:
        description: '.NET version to use'
        required: false
        default: '9.0.x'
        type: string
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: string
      upload_artifacts:
        description: 'Whether to upload build artifacts'
        required: false
        default: true
        type: boolean
      artifact_name:
        description: 'Name for the build artifact'
        required: false
        default: 'function-app-build'
        type: string
    outputs:
      artifact_name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact_name }}
      build_success:
        description: 'Whether the build was successful'
        value: ${{ jobs.build.outputs.build_success }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.set-outputs.outputs.artifact_name }}
      build_success: ${{ steps.set-outputs.outputs.build_success }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: ./.github/actions/dotnet-setup
      with:
        version: ${{ inputs.dotnet_version }}
        project-path: ${{ inputs.project_path }}
        configuration: ${{ inputs.configuration }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ inputs.project_path }}
      
    - name: Build project
      run: dotnet build ${{ inputs.project_path }} --configuration ${{ inputs.configuration }} --no-restore
      
      
    - name: Publish function app
      run: dotnet publish ${{ inputs.project_path }} --configuration ${{ inputs.configuration }} --output ./publish --no-build
      
    - name: Upload build artifacts
      if: ${{ inputs.upload_artifacts }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ./publish
        retention-days: 7
        
    - name: Set outputs
      id: set-outputs
      run: |
        echo "artifact_name=${{ inputs.artifact_name }}" >> $GITHUB_OUTPUT
        echo "build_success=true" >> $GITHUB_OUTPUT
        
    - name: Build summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ .NET ${{ inputs.dotnet_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Project: ${{ inputs.project_path }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Configuration: ${{ inputs.configuration }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Artifacts: ${{ inputs.upload_artifacts && inputs.artifact_name || 'Not uploaded' }}" >> $GITHUB_STEP_SUMMARY
