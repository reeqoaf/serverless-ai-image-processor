name: Create Environment

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'New environment name (e.g., test, qa, demo)'
        required: true
        type: string
      subscription_id:
        description: 'Azure Subscription ID'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        default: 'West Europe'
        type: choice
        options:
          - 'West Europe'
          - 'North Europe'
          - 'East US'
          - 'West US 2'
          - 'Central US'
          - 'East US 2'
          - 'West US'
          - 'Southeast Asia'
      environment_type:
        description: 'Environment type (currently only dev is supported)'
        required: false
        default: 'dev'
        type: choice
        options:
          - 'dev'
      project_name:
        description: 'Project name (default: ai-image-processor)'
        required: false
        default: 'ai-image-processor'
        type: string
      owner:
        description: 'Resource owner/team'
        required: false
        default: 'Dev Team'
        type: string
      cost_center:
        description: 'Cost center for billing'
        required: false
        default: 'R&D'
        type: string
      custom_config:
        description: 'Custom configuration (JSON format) - optional advanced settings'
        required: false
        default: '{}'
        type: string

env:
  TF_VERSION: '1.10.0'
  TF_WORKING_DIR: 'terraform'

jobs:
  create-environment:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate environment name
      run: |
        ENV_NAME="${{ inputs.environment_name }}"
        if [[ ! "$ENV_NAME" =~ ^[a-z0-9-]+$ ]]; then
          echo "ERROR: Environment name must contain only lowercase letters, numbers, and hyphens."
          echo "Received: '$ENV_NAME'"
          exit 1
        fi
        
        # Check if environment already exists
        if [ -d "terraform/envs/$ENV_NAME" ]; then
          echo "ERROR: Environment '$ENV_NAME' already exists."
          echo "Please choose a different name or delete the existing environment first."
          exit 1
        fi
        
        echo "SUCCESS: Environment name validation passed: $ENV_NAME"
        
    - name: Create environment directory
      run: |
        ENV_NAME="${{ inputs.environment_name }}"
        mkdir -p "terraform/envs/$ENV_NAME"
        echo "SUCCESS: Created directory: terraform/envs/$ENV_NAME"
        
    - name: Generate terraform.tfvars file
      run: |
        ENV_NAME="${{ inputs.environment_name }}"
        TFVARS_FILE="terraform/envs/$ENV_NAME/terraform.tfvars"
        
        # Set variables for the terraform.tfvars file
        SUBSCRIPTION_ID="${{ inputs.subscription_id }}"
        PROJECT_NAME="${{ inputs.project_name }}"
        LOCATION="${{ inputs.location }}"
        ENV_TYPE="${{ inputs.environment_type }}"
        OWNER="${{ inputs.owner }}"
        COST_CENTER="${{ inputs.cost_center }}"
        
        # Use dev configuration (only supported environment for now)
        STORAGE_TIER="Standard"
        STORAGE_REPLICATION="LRS"
        ENABLE_VERSIONING="false"
        COGNITIVE_SKU="F0"
        FUNCTION_TIER="Consumption"
        FUNCTION_SIZE="Y1"
        MAX_RETRIES="3"
        
        # Parse custom configuration if provided
        CUSTOM_CONFIG='${{ inputs.custom_config }}'
        if [ "$CUSTOM_CONFIG" != "{}" ]; then
          echo "Using custom configuration: $CUSTOM_CONFIG"
          # Extract custom values (basic JSON parsing)
          STORAGE_TIER=$(echo "$CUSTOM_CONFIG" | jq -r '.storage_tier // "'$STORAGE_TIER'"')
          STORAGE_REPLICATION=$(echo "$CUSTOM_CONFIG" | jq -r '.storage_replication // "'$STORAGE_REPLICATION'"')
          ENABLE_VERSIONING=$(echo "$CUSTOM_CONFIG" | jq -r '.enable_versioning // '$ENABLE_VERSIONING)
          COGNITIVE_SKU=$(echo "$CUSTOM_CONFIG" | jq -r '.cognitive_sku // "'$COGNITIVE_SKU'"')
          FUNCTION_TIER=$(echo "$CUSTOM_CONFIG" | jq -r '.function_tier // "'$FUNCTION_TIER'"')
          FUNCTION_SIZE=$(echo "$CUSTOM_CONFIG" | jq -r '.function_size // "'$FUNCTION_SIZE'"')
          MAX_RETRIES=$(echo "$CUSTOM_CONFIG" | jq -r '.max_retries // '$MAX_RETRIES)
        fi
        
        cat > "$TFVARS_FILE" << 'EOF'
        # Environment Configuration for $ENV_NAME
        # Generated on $(date)
        
        # =============================================================================
        # REQUIRED VARIABLES
        # =============================================================================
        
        subscription_id = "$SUBSCRIPTION_ID"
        
        # =============================================================================
        # CORE INFRASTRUCTURE VARIABLES
        # =============================================================================
        
        project_name = "$PROJECT_NAME"
        environment  = "$ENV_NAME"
        location     = "$LOCATION"
        
        # =============================================================================
        # STORAGE CONFIGURATION
        # =============================================================================
        
        storage_config = {
          tier                = "$STORAGE_TIER"
          replication_type    = "$STORAGE_REPLICATION"
          enable_versioning   = $ENABLE_VERSIONING
        }
        
        # =============================================================================
        # COGNITIVE SERVICES CONFIGURATION
        # =============================================================================
        
        cognitive_services_config = {
          sku_name = "$COGNITIVE_SKU"
        }
        
        # =============================================================================
        # FUNCTION APP CONFIGURATION
        # =============================================================================
        
        function_app_config = {
          sku_tier = "$FUNCTION_TIER"
          sku_size = "$FUNCTION_SIZE"
        }
        
        # =============================================================================
        # APPLICATION CONFIGURATION
        # =============================================================================
        
        max_retries = $MAX_RETRIES
        
        # =============================================================================
        # TAGS CONFIGURATION
        # =============================================================================
        
        tags = {
          Project     = "AI Image Processor"
          Environment = "$(echo $ENV_NAME | tr '[:lower:]' '[:upper:]')"
          ManagedBy   = "Terraform"
          Owner       = "$OWNER"
          CostCenter  = "$COST_CENTER"
          CreatedBy   = "GitHub Actions"
          CreatedOn   = "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        }
        EOF
        
        echo "SUCCESS: Generated terraform.tfvars file: $TFVARS_FILE"
        
    - name: Validate generated configuration
      run: |
        ENV_NAME="${{ inputs.environment_name }}"
        TFVARS_FILE="terraform/envs/$ENV_NAME/terraform.tfvars"
        
        echo "## Generated Configuration" >> $GITHUB_STEP_SUMMARY
        echo "Environment: $ENV_NAME" >> $GITHUB_STEP_SUMMARY
        echo "Configuration file: $TFVARS_FILE" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Configuration Preview" >> $GITHUB_STEP_SUMMARY
        echo '```hcl' >> $GITHUB_STEP_SUMMARY
        cat "$TFVARS_FILE" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Validate the configuration
        if [ -f "$TFVARS_FILE" ]; then
          echo "SUCCESS: Configuration file created successfully"
        else
          echo "ERROR: Failed to create configuration file"
          exit 1
        fi
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }
        
    - name: Validate Terraform configuration
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        ENV_NAME="${{ inputs.environment_name }}"
        echo "Validating Terraform configuration for environment: $ENV_NAME"
        
        # Initialize Terraform with environment-specific state
        terraform init \
          -backend-config="key=terraform-$ENV_NAME.tfstate"
        
        # Validate the configuration
        terraform validate
        
        # Plan the deployment
        terraform plan -var-file="envs/$ENV_NAME/terraform.tfvars" -out=tfplan
        
        echo "SUCCESS: Terraform configuration validation passed"
        
    - name: Create environment summary
      run: |
        ENV_NAME="${{ inputs.environment_name }}"
        ENV_TYPE="${{ inputs.environment_type }}"
        echo "## Environment Creation Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Environment Name: $ENV_NAME" >> $GITHUB_STEP_SUMMARY
        echo "- Environment Type: $ENV_TYPE" >> $GITHUB_STEP_SUMMARY
        echo "- Project Name: ${{ inputs.project_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- Location: ${{ inputs.location }}" >> $GITHUB_STEP_SUMMARY
        echo "- Configuration File: terraform/envs/$ENV_NAME/terraform.tfvars" >> $GITHUB_STEP_SUMMARY
        echo "- Terraform Validation: Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Review the generated configuration file" >> $GITHUB_STEP_SUMMARY
        echo "2. Run the 'Terraform Infrastructure' workflow to deploy the environment" >> $GITHUB_STEP_SUMMARY
        echo "3. Or run the 'Full Deploy' workflow to deploy both infrastructure and function app" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Configuration Details (Dev Environment)" >> $GITHUB_STEP_SUMMARY
        echo "- **Storage**: Standard (LRS)" >> $GITHUB_STEP_SUMMARY
        echo "- **Cognitive Services**: F0 (Free tier)" >> $GITHUB_STEP_SUMMARY
        echo "- **Function App**: Consumption (Y1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Blob Versioning**: Disabled" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Custom Configuration" >> $GITHUB_STEP_SUMMARY
        if [ "${{ inputs.custom_config }}" != "{}" ]; then
          echo "Custom settings were applied from JSON configuration" >> $GITHUB_STEP_SUMMARY
        else
          echo "Using default dev environment configuration" >> $GITHUB_STEP_SUMMARY
        fi
